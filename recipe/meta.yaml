{% set name = "hexbytes" %}
{% set version = "1.3.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a657eebebdfe27254336f98d8af6e2236f3f83aed164b87466b6cf6c5f5a4765

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<38]

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

{% set ignore_tests = "" %}
# Skip following tests for PY3.13 because eth-utils is missing for PY3.13
{% set ignore_tests = ignore_tests + " --ignore=tests/core/test_hexbytes.py" %}  # [py==313]

test:
  source_files:
    - tests
  imports:
    - hexbytes
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests {{ ignore_tests }}
  requires:
    - pip
    - pytest >=7.0.0
    - eth-utils >=2.0.0  # [py<313]
    - hypothesis >=3.44.24

about:
  home: https://github.com/ethereum/hexbytes
  summary: Python bytes subclass that decodes hex, with a readable console output
  description: Python bytes subclass that decodes hex, with a readable console output
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/ethereum/hexbytes
  doc_url: https://hexbytes.readthedocs.io

extra:
  recipe-maintainers:
    - step21
